apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-events
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-events
  template:
    metadata:
      labels:
        app: college-events
    spec:
      containers:
        - name: college-events
          image: dineshh007/college-event-portal:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-events-service
spec:
  type: NodePort
  selector:
    app: college-events
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30015